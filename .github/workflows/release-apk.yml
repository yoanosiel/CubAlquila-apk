name: Crear APK Release CubAlquila

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      STORE_PASSWORD: ${{ secrets.CUBALQUILA_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.CUBALQUILA_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.CUBALQUILA_KEY_ALIAS }}
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Verificar keystore
        run: |
          test -f app/taxicuba-identity.jks
          keytool -list -keystore app/taxicuba-identity.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Dar permisos a Gradle
        run: chmod +x ./gradlew

      - name: Compilar APK Release
        run: ./gradlew assembleRelease --no-configuration-cache -Pksp.incremental=false

      - name: Subir APK Release
        uses: actions/upload-artifact@v4
        with:
          name: CubAlquila-v1.1-code2-release
          path: app/build/outputs/apk/release/app-release.apk
