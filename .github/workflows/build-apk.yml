name: Compilar y Firmar APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Código del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Conceder permisos de ejecución a gradlew
      run: chmod +x ./gradlew

    - name: Compilar APK limpia (Modo exitoso anterior)
      # Al haber limpiado el build.gradle, assembleRelease generará la APK sin pedir contraseñas intermedias
      run: ./gradlew assembleRelease --no-configuration-cache

    - name: Instalar apksigner en el servidor
      run: sudo apt-get update && sudo apt-get install -y apksigner

    - name: Firmar y Renombrar APK de forma Externa
      run: |
        # Buscamos la APK generada en las carpetas de salida
        APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
        KEY_PATH=$(find . -name "taxicuba-identity.jks" | head -n 1)
        
        echo "APK base encontrada: $APK_PATH"
        echo "Llave de firma encontrada: $KEY_PATH"
        
        # Sello definitivo con tu clave e inyección del nombre oficial CubAlquila
        apksigner sign --ks "$KEY_PATH" --ks-pass pass:"Hisa.261199." --out CubAlquila.apk "$APK_PATH"

    - name: Subir APK Generado a GitHub
      uses: actions/upload-artifact@v4
      with:
        name: CubAlquila-Descarga
        path: CubAlquila.apk
