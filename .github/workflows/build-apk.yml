name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -1)
        chmod +x $GRADLEW_PATH

    - name: Build Release APK
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -1)
        cd $(dirname $GRADLEW_PATH)
        ./gradlew assembleRelease

    - name: Sign APK
      run: |
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | tail -1)
        UNSIGNED_APK=$(find . -path "*/build/outputs/apk/release/*.apk" | head -1)
        JKS_FILE=$(find . -name "taxicuba-identity.jks" | head -1)
        
        echo "APK encontrado: $UNSIGNED_APK"
        echo "Llave JKS encontrada: $JKS_FILE"
        
        if [ -z "$UNSIGNED_APK" ] || [ -z "$JKS_FILE" ]; then
          echo "❌ Error: No se encontró el APK generado o el archivo de firmas .jks"
          exit 1
        fi
        
        $BUILD_TOOLS_DIR/apksigner sign --ks "$JKS_FILE" --ks-pass pass: --out TaxicubaBot.apk "$UNSIGNED_APK"

    - name: Upload TaxicubaBot APK
      uses: actions/upload-artifact@v4
      with:
        name: TaxicubaBot-Descarga
        path: TaxicubaBot.apk
