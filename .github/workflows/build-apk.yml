name: Compilar y Firmar CubAlquila

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Código del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Corregir sintaxis KSP y desactivar firma interna
      run: |
        # Reparamos cualquier comilla sobrante en KSP y apagamos la firma de Gradle para evitar bloqueos
        if [ -f app/build.gradle.kts ]; then 
          sed -i 's/"ksp"(/ksp(/g' app/build.gradle.kts
          sed -i 's/signingConfig = signingConfigs.getByName("release")//g' app/build.gradle.kts
        fi
        if [ -f app/build.gradle ]; then 
          sed -i 's/"ksp"(/ksp(/g' app/build.gradle
          sed -i 's/signingConfig signingConfigs.release//g' app/build.gradle
        fi

    - name: Conceder Permisos a Gradle
      run: chmod +x ./gradlew

    - name: Compilar APK (Modo Release)
      run: ./gradlew assembleRelease --no-configuration-cache

    - name: Instalar apksigner en el servidor
      run: sudo apt-get update && sudo apt-get install -y apksigner

    - name: Firmar APK con llave JKS
      run: |
        # Buscamos el APK generado y tu llave
        UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
        JKS_FILE=$(find . -name "*.jks" | head -n 1)
        
        echo "✔ APK encontrado: $UNSIGNED_APK"
        echo "✔ Llave encontrada: $JKS_FILE"
        
        # Aplicamos la firma usando exactamente tu contraseña con el punto final
        apksigner sign --ks "$JKS_FILE" --ks-pass "pass:Hisa.261199." --out CubAlquila-Firmada.apk "$UNSIGNED_APK"

    - name: Subir APK Generado a GitHub
      uses: actions/upload-artifact@v4
      with:
        name: CubAlquila-Descarga
        path: CubAlquila-Firmada.apk
