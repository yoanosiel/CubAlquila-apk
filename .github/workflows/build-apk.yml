name: Compilar y Firmar APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Código del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Ubicar Archivo JKS en Rutas Requeridas
      run: |
        # Buscamos tu llave original en el proyecto
        REAL_KEY=$(find . -name "taxicuba-identity.jks" | head -n 1)
        echo "Llave real encontrada en: $REAL_KEY"
        
        # Copiamos la llave en la raíz principal
        cp "$REAL_KEY" ./my-upload-key.jks
        
        # Copiamos la llave DENTRO de la carpeta app (Esta es la solución al error actual)
        mkdir -p app
        cp "$REAL_KEY" ./app/my-upload-key.jks
        
        echo "Espejos JKS creados correctamente en ./ y ./app/"

    - name: Conceder permisos de ejecución a gradlew
      run: chmod +x ./gradlew

    - name: Compilar APK (Modo Release)
      # Pasamos los parámetros vinculando directamente el archivo de la carpeta app
      run: |
        ./gradlew assembleRelease --no-configuration-cache \
          -Pandroid.injected.signing.store.file="my-upload-key.jks" \
          -Pandroid.injected.signing.store.password="Hisa.261199." \
          -Pandroid.injected.signing.key.alias="taxicuba-identity" \
          -Pandroid.injected.signing.key.password="Hisa.261199."

    - name: Instalar apksigner en el servidor
      run: sudo apt-get update && sudo apt-get install -y apksigner

    - name: Firmar y Renombrar APK Final
      run: |
        APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
        echo "APK base encontrada: $APK_PATH"
        
        # Sello externo usando la llave y asignando el nombre limpio CubAlquila
        apksigner sign --ks ./my-upload-key.jks --ks-pass pass:"Hisa.261199." --out CubAlquila.apk "$APK_PATH"

    - name: Subir APK Generado a GitHub
      uses: actions/upload-artifact@v4
      with:
        name: CubAlquila-Descarga
        path: CubAlquila.apk
