name: Compilar y Firmar CubAlquila APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Código del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Restaurar Gradle Wrapper (Crea el archivo ejecutable faltante)
      run: gradle wrapper

    - name: Conceder Permisos de Ejecución a Gradle
      run: chmod +x gradlew

    - name: Compilar APK en Modo Release
      run: ./gradlew assembleRelease

    - name: Firmar APK Oficial con apksigner (Localización Dinámica)
      run: |
        # Buscar el ejecutable apksigner dentro de las carpetas del SDK de Android en el servidor
        REAL_APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort | tail -n 1)
        
        # Localizar la APK generada por la compilación
        BASE_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
        
        # Firmar usando la ruta exacta encontrada en el sistema
        $REAL_APKSIGNER sign --ks app/taxicuba-identity.jks \
                             --ks-pass pass:Hisa.261199. \
                             --out app/build/outputs/apk/release/CubAlquila.apk \
                             $BASE_APK

    - name: Subir Paquete de Descarga a GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CubAlquila-Descarga
        path: app/build/outputs/apk/release/CubAlquila.apk
