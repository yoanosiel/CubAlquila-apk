name: Compilar APK de prueba

on:
  push:
    branches: [ migration-supabase ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permisos a Gradle
        run: chmod +x ./gradlew

      - name: Compilar APK de prueba
        run: ./gradlew assembleDebug --no-configuration-cache

      - name: Subir APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: CubAlquila-Supabase-debug
          path: app/build/outputs/apk/debug/app-debug.apk
